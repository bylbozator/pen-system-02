name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: admin
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Create .env for docker-compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=pen
          POSTGRES_PASSWORD=pen
          POSTGRES_DB=pen
          DATABASE_URL=postgresql://pen:pen@postgres:5432/pen
          REDIS_URL=redis://:penredis@redis:6379/0
          REDIS_PASSWORD=penredis
          SECRET_KEY=ci-e2e-secret-key-please-change-0123456789
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          RATE_LIMIT_LOGIN=100/minute
          DEBUG=False
          ADMIN_EMAIL=admin@example.com
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=admin
          CORS_ORIGINS=http://localhost,https://localhost,http://localhost:8080
          GRAFANA_PASSWORD=admin
          EOF

      - name: Generate self-signed SSL certificates
        run: |
          mkdir -p ssl
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout ssl/nginx-selfsigned.key \
            -out ssl/nginx-selfsigned.crt \
            -days 1 -subj "/CN=localhost"

      - name: Start stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/login >/dev/null 2>&1 \
              && curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Stack is up"
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack did not become ready in time"
          docker compose ps
          exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install libmagic (for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q
